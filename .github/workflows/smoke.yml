name: GUI smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          stat -f '%Su' /dev/console

      # Build first so a cold compiler does not consume the smoke script's build timeout.
      - name: Build debug app
        id: build
        run: LINE_APP_OUTPUT="$PWD/build/smoke/Tape.app" ./scripts/build-app.sh debug

      - name: Attach an accessibility reader
        run: |
          mkdir -p build/reports
          osascript > build/reports/accessibility-reader.log 2>&1 <<'APPLESCRIPT' &
          repeat 600 times
            tell application "System Events"
              if exists application process "Tape" then
                get entire contents of application process "Tape"
              end if
            end tell
            delay 0.2
          end repeat
          APPLESCRIPT
          echo "$!" > build/accessibility-reader.pid

      # These scenarios share the desktop and must run sequentially.
      - name: Tracking smoke
        run: |
          mkdir -p build/reports
          python3 scripts/smoke-test.py 2>&1 | tee build/reports/tracking-smoke.log

      - name: Main window smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p build/reports
          python3 scripts/smoke-test.py --main-window 2>&1 | tee build/reports/main-window-smoke.log

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-${{ matrix.runner }}
          path: |
            build/reports/
            build/*smoke-results/
          retention-days: 7
          if-no-files-found: warn
