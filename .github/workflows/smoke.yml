name: GUI smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: GUI / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - tracking
          - main-window
          - timeline
          - creation
          - editing
          - overwrite
          - resize-overwrite
          - tags
          - statistics
          - system-activity
          - continuation
          - dismissal
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          stat -f '%Su' /dev/console

      # Build first so a cold compiler does not consume the smoke script's build timeout.
      - name: Build debug app
        id: build
        run: LINE_APP_OUTPUT="$PWD/build/smoke/Tape.app" ./scripts/build-app.sh debug

      - name: Attach an accessibility reader
        run: |
          mkdir -p build/reports
          # SwiftUI creates its accessibility tree only after a client requests it.
          # System Events is pre-authorized on GitHub's macOS image. This reader
          # observes the isolated smoke app without sending input or taking focus.
          osascript > build/reports/accessibility-reader.log 2>&1 <<'APPLESCRIPT' &
          repeat
            try
              tell application "System Events"
                if exists application process "Tape" then
                  get entire contents of application process "Tape"
                end if
              end tell
            on error message number code
              -- The smoke app exits between scenarios and between persistence launches.
              if code is not -1728 and code is not -600 then error message number code
            end try
            delay 0.2
          end repeat
          APPLESCRIPT
          echo "$!" > "$RUNNER_TEMP/tape-accessibility-reader.pid"

      # Each matrix job has its own desktop, build directory, and test data.
      - name: Run smoke scenario
        env:
          SMOKE_SCENARIO: ${{ matrix.scenario }}
        run: |
          mkdir -p build/reports
          args=(--timeout 90)
          if [[ "$SMOKE_SCENARIO" != tracking ]]; then
            args+=("--$SMOKE_SCENARIO")
          fi
          python3 scripts/smoke-test.py "${args[@]}" 2>&1 | tee "build/reports/$SMOKE_SCENARIO-smoke.log"

      - name: Stop accessibility reader
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/tape-accessibility-reader.pid" ]]; then
            reader_pid=$(cat "$RUNNER_TEMP/tape-accessibility-reader.pid")
            if ! kill -0 "$reader_pid" 2>/dev/null; then
              cat build/reports/accessibility-reader.log
              echo 'The accessibility reader exited unexpectedly.' >&2
              exit 1
            fi
            kill "$reader_pid"
            rm "$RUNNER_TEMP/tape-accessibility-reader.pid"
          fi

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results-${{ matrix.scenario }}
          path: |
            build/reports/
            build/*smoke-results/
          retention-days: 7
          if-no-files-found: warn

  # One stable required check covers the entire matrix, including failed jobs.
  smoke:
    name: smoke
    needs: scenarios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every GUI scenario to pass
        env:
          RESULT: ${{ needs.scenarios.result }}
        run: test "$RESULT" = success
